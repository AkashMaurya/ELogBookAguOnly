services:
  - type: web
    name: elogbookagu
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn elogbookagu.elogbookagu.wsgi:application
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: elogbookagu.elogbookagu.settings
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
